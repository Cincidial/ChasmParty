<template id="party-pokemon-filter-form-template">
    <style></style>
    <div>
        <label>
            Generation
            <select id="generation_select"></select>
        </label>
        <label style="cursor: pointer">Only Legendaries<input type="checkbox" id="only_legendary_checkbox" /></label>
        <label style="cursor: pointer">Hide Legendaries<input type="checkbox" id="hide_legendary_checkbox" /></label>
    </div>

    <div>
        <label>
            Evolution
            <select id="evolution_select">
                <option value="Any">Any</option>
                <option value="First">First</option>
                <option value="Final">Final</option>
                <option value="Single">Single</option>
            </select>
        </label>

        <label style="cursor: pointer">Starters Only<input type="checkbox" id="starter_only_checkbox" /></label>
        <party-drop-down id="search_dropdown" placeholder="Enter a Pokémon"></party-drop-down>
    </div>
</template>
