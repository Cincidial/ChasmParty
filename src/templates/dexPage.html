<template id="party-dex-page-template">
    <style>
        .card {
            background: var(--card-bg, #ffffff);
            border: var(--card-border, 1px solid #e0e0e0);
            border-radius: var(--card-radius, 8px);
            box-shadow: var(--card-shadow, 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 3px;
        }
    </style>
    <h1 style="text-align: center">Pokédex</h1>
    <div class="card" style="width: 300px">
        <div>
            <party-header-option id="filterOptionPokemon" key="pokemon">Pokémon</party-header-option>
            <party-header-option id="filterOptionAbility" key="ability">Ability</party-header-option>
            <party-header-option id="filterOptionMove" key="move">Move</party-header-option>
        </div>
    </div>
    <party-drop-down id="test" placeholder="placeholder"></party-drop-down>
</template>
