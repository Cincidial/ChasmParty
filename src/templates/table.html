<template id="party-table-template">
    <style>
        table {
            border: 1px solid #e8eadd;
            max-width: 95vw;
        }

        th {
            position: sticky;
            top: 0;
            min-width: 75px;
            padding: 2px 7px;
            font-size: 18px;
            color: #e8eadd;
            background-color: #7d9198;
            border-bottom: 3px solid #e8eadd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #38393b;
            background-color: #e8eadd;
        }

        tbody tr:nth-child(odd) {
            background-color: #7d9198;
        }

        tbody tr:nth-child(even) {
            background-color: #4d5d69;
        }

        tbody tr[has-onclick]:hover {
            color: #38393b;
            background-color: #e8eadd;
            cursor: pointer;
        }

        td {
            font-size: 17px;
            padding: 2px 7px;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: break-word;
        }

        td > * {
            display: flex;
            justify-content: center;
        }
    </style>

    <table id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
    </table>
</template>
