<template id="party-table-template">
    <style>
        .headerRow {
            background-color: blue;
        }

        tbody tr:nth-child(odd) {
            background-color: #69a3d0;
        }

        tbody tr:nth-child(even) {
            background-color: #4d5d69;
        }
    </style>
    <table id="table">
        <thead id="thead" class="headerRow"></thead>
        <tbody id="tbody"></tbody>
    </table>
</template>
