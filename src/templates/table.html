<template id="party-table-template">
    <style>
        .scroll {
            border: 1px solid #e8eadd;
            padding-right: 10px;
            overflow-y: auto;
        }

        table {
            width: 95vw;
            max-width: 95vw;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 2;
            min-width: 75px;
            padding: 2px 7px;
            font-size: 18px;
            color: #e8eadd;
            background-color: #7d9198;
            border-bottom: 3px solid #e8eadd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #38393b;
            background-color: #e8eadd;
        }

        .tr_odd {
            background-color: #7d9198;
        }

        .tr_even {
            background-color: #4d5d69;
        }

        tbody tr[has-onclick]:hover {
            color: #38393b;
            background-color: #e8eadd;
            cursor: pointer;
        }

        td {
            font-size: 17px;
            padding: 2px 7px;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: break-word;
        }

        td > * {
            display: flex;
            justify-content: center;
        }
    </style>

    <div id="table_scroll" class="scroll">
        <div id="table_space">
            <table id="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</template>
