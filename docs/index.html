<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chasm Party</title>
        <link rel="icon" type="favicon" href="icon.png" />
        <script defer src="src.js"></script>
    </head>
    <body>
        <loading-splash id="loadingSplash"></loading-splash>
    </body>

<template id="party-filter-group-display-template">
    <style></style>
    <div id="header_div"></div>
    <div id="data_div"></div>
</template>

<template id="party-loading-splash-template">
    <style>
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .full-page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            row-gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div class="full-page-container">
        <div class="spinner"></div>
        <div>Loading Data and Images!</div>
    </div>
</template>

<template id="party-dex-page-template">
    <style>
        .card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 3px 3px 5px #00000022;
            padding: 3px;
        }

        .filteredList {
            display: flex;
            flex-wrap: wrap;
            overflow: scroll;
            padding: 5px;
        }
    </style>
    <h1 style="text-align: center">Pokédex</h1>
    <div class="card" style="width: 300px">
        <div>
            <party-filter-option id="filter_option_pokemon" key="pokemon">Pokémon</party-filter-option>
            <party-filter-option id="filter_option_ability" key="ability">Ability</party-filter-option>
            <party-filter-option id="filter_option_move" key="move">Move</party-filter-option>
            <span id="add_filter_button">Add Filter</span>
        </div>
        <div id="filter_form"></div>
    </div>
    <div id="applied_filters_list" class="card"></div>
    <div id="pokemon_list" class="filteredList"></div>
</template>

<template id="party-dropdown-template">
    <style></style>
    <datalist id="data"></datalist>
    <input id="list" list="data" />
</template>

<template id="party-pokemon-filter-form-template">
    <style></style>
    <label>
        Generation
        <select id="generation_select"></select>
    </label>
    <label>
        Evolution
        <select id="evolution_select">
            <option value="Any">Any</option>
            <option value="First">First</option>
            <option value="Final">Final</option>
            <option value="Single">Single</option>
        </select>
    </label>
    <label>Hide Legendaries<input type="checkbox" id="hide_legendary_checkbox" /></label>
    <label>Starters Only<input type="checkbox" id="starter_only_checkbox" /></label>
</template>

<template id="party-atlas-img-template">
    <style>
        .div_image {
            background-repeat: no-repeat;
            overflow: hidden;
        }
    </style>
    <div id="img" class="div_image"></div>
</template>

<template id="party-filter-option-template">
    <style>
        .optionHeader {
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <span id="header" class="optionHeader"><slot></slot></span>
</template>

</html>
