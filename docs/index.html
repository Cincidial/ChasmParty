<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chasm Party</title>
        <link rel="icon" type="favicon" href="icon.png" />
        <script defer src="src.js"></script>
    </head>
    <body>
        <loading-splash id="loadingSplash"></loading-splash>
    </body>

<template id="party-loading-splash-template">
    <style>
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .full-page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            row-gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div class="full-page-container">
        <div class="spinner"></div>
        <div>Loading Data and Images!</div>
    </div>
</template>

<template id="party-dex-page-template">
    <style>
        .card {
            background: var(--card-bg, #ffffff);
            border: var(--card-border, 1px solid #e0e0e0);
            border-radius: var(--card-radius, 8px);
            box-shadow: var(--card-shadow, 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 3px;
        }
    </style>
    <h1 style="text-align: center">Pokédex</h1>
    <div class="card" style="width: 300px">
        <div>
            <party-header-option id="filterOptionPokemon" key="pokemon">Pokémon</party-header-option>
            <party-header-option id="filterOptionAbility" key="ability">Ability</party-header-option>
            <party-header-option id="filterOptionMove" key="move">Move</party-header-option>
        </div>
    </div>
    <party-drop-down id="test" placeholder="placeholder"></party-drop-down>
</template>

<template id="party-header-option-template">
    <style>
        .optionHeader {
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <span id="header" class="optionHeader"><slot></slot></span>
</template>

<template id="party-dropdown-template">
    <style></style>
    <datalist id="data"></datalist>
    <input id="list" list="data" />
</template>

<template id="party-atlas-img-template">
    <style>
        .div_image {
            background-repeat: no-repeat;
            overflow: hidden;
        }
    </style>
    <div id="img" class="div_image"></div>
</template>

</html>
