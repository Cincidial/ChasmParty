<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokédex</title>
        <link rel="icon" type="favicon" href="icon.png" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <script defer src="src.js"></script>
    </head>
    <body class="default-background default-text">
        <loading-splash id="loadingSplash"></loading-splash>
    </body>

<template id="party-checkbox-template">
    <style>
        :host {
            cursor: pointer;
        }
    </style>

    <label><slot></slot><input type="checkbox" id="checkbox" /></label>
</template>

<template id="party-radio-group-template">
    <style>
        .layout {
            display: inline-flex;
            flex-direction: row;
            gap: 10px;
        }

        .radio {
            cursor: pointer;
        }
    </style>

    <div id="container" class="layout"></div>
</template>

<template id="party-filter-group-display-template">
    <style>
        .card {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background-color: #69a3d0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 3px 3px 5px #00000022;
            padding: 3px;
            margin: 5px;
            width: fit-content;
        }
    </style>
    <div class="card">
        <div id="header_div" style="font-size: 20px"></div>
        <div id="data_div" style="display: flex; gap: 3px; flex-wrap: wrap"></div>
    </div>
</template>

<template id="party-capsule-template">
    <style>
        :host {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 2px solid #38393b;
            color: #38393b;
            background-color: #a6c5e1;
            padding: 0px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: fit-content;
            transition: color 0.2s;
        }

        :host([removable]:hover) {
            color: #e8eadd;
        }

        :host([removable]) {
            cursor: pointer;
        }

        .delete-button {
            display: none;
            padding: 0;
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }

        :host([removable]) .delete-button {
            display: inline-flex;
        }
    </style>

    <span id="delete_button" class="delete-button" aria-label="Remove text">🗙</span>
    <span id="text_display"></span>
</template>

<template id="party-loading-splash-template">
    <style>
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .full-page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            row-gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div class="full-page-container">
        <div class="spinner"></div>
        <div>Loading Data and Images!</div>
    </div>
</template>

<template id="party-dex-page-template">
    <style>
        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 3px 3px 5px hwb(0 0% 100% / 0.133);
            background-color: #4d5d69;
            padding: 3px;
            margin: 5px;
            width: 50%;
            min-height: 10vh;
        }

        .dataList {
            display: flex;
            flex-wrap: wrap;
            overflow: scroll;
            padding: 5px;
        }
    </style>
    <h1 style="text-align: center">Pokédex</h1>
    <div style="display: flex; flex-direction: row; overflow: scroll">
        <div class="card default-dark-accent1">
            <div style="margin-bottom: 5px">
                <span id="add_filter_button" class="button" style="margin-right: 10px">Add Filter</span>
                <party-filter-option id="filter_option_pokemon" key="pokemon">Pokémon</party-filter-option>
                <party-filter-option id="filter_option_ability" key="ability">Ability</party-filter-option>
                <party-filter-option id="filter_option_move" key="move">Move</party-filter-option>
            </div>
            <hr style="color: #e8eadd" />
            <div id="filter_form"></div>
        </div>
        <div id="applied_filters_list" class="card"></div>
    </div>
    <div
        id="filtered_data_targets_checkboxes_list"
        style="min-height: fit-content; width: fit-content; height: fit-content; margin-right: auto; margin-left: auto; padding: 10px"
    >
        <party-filter-option id="filter_show_pokemon" key="pokemon">Pokémon</party-filter-option>
        <party-filter-option id="filter_show_abilities" key="abilities">Abilities</party-filter-option>
        <party-filter-option id="filter_show_moves" key="moves">Moves</party-filter-option>
        <div class="card" style="margin: auto; width: fit-content; height: fit-content; min-height: fit-content; margin-top: 15px">
            <span id="target_data_sort_button" class="button" style="font-size: 25px; font-weight: bold; padding: 2px"></span>
            <span id="target_data_sort_container"></span>
        </div>
    </div>
    <div id="filtered_data_list" class="dataList"></div>
</template>

<template id="party-dropdown-template">
    <style></style>
    <datalist id="data"></datalist>
    <input id="list" list="data" />
</template>

<template id="party-pokemon-filter-form-template">
    <style></style>
    <div>
        <label>
            Generation
            <select id="generation_select"></select>
        </label>
        <party-checkbox id="only_legendary_checkbox">Only Legendaries</party-checkbox>
        <party-checkbox id="hide_legendary_checkbox">Hide Legendaries</party-checkbox>
    </div>

    <div>
        <label>
            Evolution
            <select id="evolution_select">
                <option value="Any">Any</option>
                <option value="First">First</option>
                <option value="Final">Final</option>
                <option value="Single">Single</option>
            </select>
        </label>

        <party-checkbox id="starter_only_checkbox">Starters Only</party-checkbox>
        <party-drop-down id="search_dropdown" placeholder="Enter a Pokémon"></party-drop-down>
    </div>
</template>

<template id="party-atlas-img-template">
    <style>
        .div_image {
            background-repeat: no-repeat;
            overflow: hidden;
        }
    </style>
    <div id="img" class="div_image"></div>
</template>

<template id="party-filter-option-template">
    <style>
        :host {
            font-size: 22px;
            border-bottom: 3px solid #7d9198;
            cursor: pointer;
            padding-left: 8px;
            padding-right: 3px;
            padding-bottom: 3px;
            transition: border 0.2s;
        }
        :host([active]) {
            border-bottom-color: #e8eadd;
        }
        :host(:not([active]):hover) {
            border-bottom: 3px solid #69a3d0;
        }
    </style>
    <span id="header"><slot></slot></span>
</template>

<template id="party-ability-filter-form-template">
    <style></style>
    <div>
        <party-checkbox id="is_primival_checkbox">Is Primeval</party-checkbox>
    </div>
    <div>
        <party-drop-down id="name_dropdown" placeholder="Ability Name"></party-drop-down>
        <input id="desc_input" placeholder="Ability Description" />
    </div>
</template>

</html>
