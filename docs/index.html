<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ruby Wasm Playground</title>
        <link rel="icon" type="favicon" href="icon.png" />
        <script defer src="src.js"></script>
    </head>
    <body></body>

<template id="atlas-img-template">
    <style>
        .div_image {
            background-repeat: no-repeat;
            overflow: hidden;
        }
    </style>
    <div id="img" class="div_image"></div>
</template>
<template id="loading-splash-template">
    <style>
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .full-page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            row-gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div class="full-page-container">
        <div class="spinner"></div>
        <div>Loading Data and Images!</div>
    </div>
</template>
</html>
